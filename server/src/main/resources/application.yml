server:
  port: 8088
  address: 0.0.0.0

spring:
  application:
    name: freshman-campus-server
  datasource:
    url: ${CAMPUS_DB_URL:jdbc:mysql://127.0.0.1:3306/freshman_campus_ai?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${CAMPUS_DB_USERNAME:root}
    password: ${CAMPUS_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: warn

campus:
  seed-demo-data: ${CAMPUS_SEED_DEMO_DATA:false}
